name: Publish

# Tag vX.Y.Z → npm publish with provenance. The OIDC attestation links the
# artifact on npm to this exact workflow run and commit, which is tier 1 of
# docs/verify.md. The release notes must carry the artifact SHA-256; the job
# prints it so the person cutting the release can paste it.
#
# Requires (one-time, repo settings): the NPM_TOKEN secret with publish rights
# to @group-space, and the package's provenance requirement enabled on npm.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:vectors
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Artifact digest for the release notes
        run: npm pack --silent | xargs sha256sum
